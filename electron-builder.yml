appId: com.electron.app.wbt
productName: TaskMatrix WBT
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
win:
  appId: com.electron.app.wbt
  executableName: taskmatrix-wbt
  icon: build/icon.ico
  target: nsis
nsis:
  artifactName: TaskMatrix-WBT-${version}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  appId: com.whiteboard.taskmatrix
  executableName: taskmatrix-wbt
  icon: build/icon.png
  description: TaskMatrix WBT project management application
  desktop:
    Name: TaskMatrix WBT
    StartupWMClass: taskmatrix-wbt
  target:
    - AppImage
    - deb
  category: Utility
  synopsis: TaskMatrix WBT project management application
  vendor: Whiteboard Technologies
deb:
  packageName: taskmatrix-wbt
  maintainer: Whiteboard Technologies
  afterInstall: build/linux-postinstall.sh
  afterRemove: build/linux-postremove.sh
appImage:
  artifactName: ${name}-${version}.${ext}
  desktop:
    Name: TaskMatrix WBT
    StartupWMClass: taskmatrix-wbt
npmRebuild: false
publish:
  provider: github
  owner: raunak234362
  repo: TaskMatrix-Electron
