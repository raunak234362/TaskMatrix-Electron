name: Build and publish desktop release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    environment: PROD_BASE_URL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create renderer environment
        shell: bash
        run: |
          echo "VITE_BASE_URL=$VITE_BASE_URL" > .env
          echo "VITE_SOCKET_URL=$VITE_SOCKET_URL" >> .env
          echo "VITE_GITHUB_TOKEN_WBTIT=$VITE_GITHUB_TOKEN_WBTIT" >> .env
          echo "VITE_GITHUB_TOKEN_RAUNAK=$VITE_GITHUB_TOKEN_RAUNAK" >> .env
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_GITHUB_TOKEN_WBTIT: ${{ secrets.VITE_GITHUB_TOKEN_WBTIT }}
          VITE_GITHUB_TOKEN_RAUNAK: ${{ secrets.VITE_GITHUB_TOKEN_RAUNAK }}

      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Build Windows installer
        run: npm run build:windows
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_CERT_PUBLISHER_NAME: ${{ secrets.WINDOWS_CERT_PUBLISHER_NAME }}

      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.exe', '.yml', '.blockmap') } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content dist/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS-windows.txt

  build-linux:
    runs-on: ubuntu-latest
    environment: PROD_BASE_URL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create renderer environment
        shell: bash
        run: |
          echo "VITE_BASE_URL=$VITE_BASE_URL" > .env
          echo "VITE_SOCKET_URL=$VITE_SOCKET_URL" >> .env
          echo "VITE_GITHUB_TOKEN_WBTIT=$VITE_GITHUB_TOKEN_WBTIT" >> .env
          echo "VITE_GITHUB_TOKEN_RAUNAK=$VITE_GITHUB_TOKEN_RAUNAK" >> .env
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_GITHUB_TOKEN_WBTIT: ${{ secrets.VITE_GITHUB_TOKEN_WBTIT }}
          VITE_GITHUB_TOKEN_RAUNAK: ${{ secrets.VITE_GITHUB_TOKEN_RAUNAK }}

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          }

      - name: Build and validate Linux packages
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Linux update metadata and checksums
        run: |
          test -s dist/latest-linux.yml
          sha256sum dist/*.deb dist/*.AppImage dist/latest-linux.yml > dist/SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/latest-linux.yml
            dist/SHA256SUMS-linux.txt

  build-mac:
    runs-on: macos-latest
    environment: PROD_BASE_URL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create renderer environment
        shell: bash
        run: |
          echo "VITE_BASE_URL=$VITE_BASE_URL" > .env
          echo "VITE_SOCKET_URL=$VITE_SOCKET_URL" >> .env
          echo "VITE_GITHUB_TOKEN_WBTIT=$VITE_GITHUB_TOKEN_WBTIT" >> .env
          echo "VITE_GITHUB_TOKEN_RAUNAK=$VITE_GITHUB_TOKEN_RAUNAK" >> .env
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_GITHUB_TOKEN_WBTIT: ${{ secrets.VITE_GITHUB_TOKEN_WBTIT }}
          VITE_GITHUB_TOKEN_RAUNAK: ${{ secrets.VITE_GITHUB_TOKEN_RAUNAK }}

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Build macOS application
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
          else
            unset CSC_LINK
            echo "MAC_CSC_LINK is not configured; building unsigned macOS artifacts."
          fi

          if [ -n "$MAC_CSC_KEY_PASSWORD" ]; then
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            unset CSC_KEY_PASSWORD
          fi

          npm run build:mac
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            dist/*.dmg
            dist/latest-mac.yml

  release:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate required release artifacts
        run: |
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -s release-assets/latest.yml
          test -s release-assets/latest-linux.yml
          test -s release-assets/SHA256SUMS-windows.txt
          test -s release-assets/SHA256SUMS-linux.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TaskMatrix WBT ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
